{% extends 'students/base.html' %}

{% block content %}
    <h1>学生列表</h1>
    <div style="margin-bottom: 1rem;">
        <a href="{% url 'add_student' %}" class="btn btn-primary">添加学生</a>
    </div>
    <table>
        <thead>
            <tr>
                <th>学号</th>
                <th>姓名</th>
                <th>学院</th>
                <th>专业</th>
                <th>班级</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
                <tr>
                    <td>{{ student.student_id }}</td>
                    <td>{{ student.name }}</td>
                    <td>{{ student.college }}</td>
                    <td>{{ student.major }}</td>
                    <td>{{ student.class_name }}</td>
                    <td>
                        <a href="{% url 'edit_student' student.student_id %}" class="btn btn-secondary">编辑</a>
                        <a href="{% url 'delete_student' student.student_id %}" class="btn btn-danger">删除</a>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="6" style="text-align: center;">暂无学生信息</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
