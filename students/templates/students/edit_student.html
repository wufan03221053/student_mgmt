{% extends 'students/base.html' %}

{% block content %}
    <div class="form-container">
        <h1>编辑学生</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="student_id">学号:</label>
                <input type="text" id="student_id" name="student_id" value="{{ student.student_id }}" readonly required>
            </div>
            <div class="form-group">
                <label for="name">姓名:</label>
                <input type="text" id="name" name="name" value="{{ student.name }}" required>
            </div>
            <div class="form-group">
                <label for="college">学院:</label>
                <input type="text" id="college" name="college" value="{{ student.college }}" required>
            </div>
            <div class="form-group">
                <label for="major">专业:</label>
                <input type="text" id="major" name="major" value="{{ student.major }}" required>
            </div>
            <div class="form-group">
                <label for="class_name">班级:</label>
                <input type="text" id="class_name" name="class_name" value="{{ student.class_name }}" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">保存</button>
                <a href="{% url 'student_list' %}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
{% endblock %}
